name: FGO B服每日签到

on:
  # 定时已改为 Cloudflare Workers Cron 触发(见 cf-cron/):
  # Workers 每天 UTC 17:05 调 workflow_dispatch 启动本流程
  workflow_dispatch:  # 手动 / 外部触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pynacl

      - name: FGO daily check-in
        run: python checkin.py
        env:
          FGO_AUTH_JSON: ${{ secrets.FGO_AUTH_JSON }}
          # 每次运行自动合成的青铜果实数量 (0=关闭); 在仓库 Settings > Variables 设置
          FGO_APPLE_NUM: ${{ vars.FGO_APPLE_NUM || '0' }}
          # AP 达到该阈值才开始合成 (默认120; 设为 max = AP满了才合成); 也在仓库 Settings > Variables 设置
          FGO_APPLE_AP_MIN: ${{ vars.FGO_APPLE_AP_MIN || '120' }}
          # 可选：私有日志仓库，例如你的 GitHub 用户名
          FGO_LOG_OWNER: ${{ secrets.FGO_LOG_OWNER }}
          FGO_LOG_REPO: ${{ secrets.FGO_LOG_REPO || 'FGO-Bilibili-DailyBonusLog' }}
          FGO_LOG_PAT: ${{ secrets.FGO_LOG_PAT }}
          # 可选：Telegram 通知
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}

      - name: Sync refreshed token back to repo secret
        if: always()
        run: python update_secret.py
        env:
          FGO_UPDATE_PAT: ${{ secrets.FGO_UPDATE_PAT }}
